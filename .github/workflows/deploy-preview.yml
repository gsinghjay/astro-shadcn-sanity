name: Deploy preview (capstone)

# Resurrects the old `deploy.yml` (deleted in the Pages→Workers migration, a7472b4),
# adapted for the Astro 6 / @astrojs/cloudflare v13 Workers model. Deploys the
# content-only preview Worker `ywcc-capstone-preview` (built with
# PUBLIC_SANITY_VISUAL_EDITING_ENABLED=true → drafts + stega for Studio Presentation).
# Story 26.12 (hybrid restore).
#
# Required repo config (Settings → Secrets and variables → Actions):
#   secrets.CLOUDFLARE_API_TOKEN    — token with Workers Scripts:Edit on the account
#   secrets.SANITY_API_READ_TOKEN   — Viewer read token; needed at BUILD time because
#                                     rss.xml / *.ics prerender under VE=true and
#                                     loadQuery(drafts) throws without it
#   vars.CLOUDFLARE_ACCOUNT_ID      — optional; defaults to the YWCC Capstone account

on:
  push:
    branches: [preview]
    paths:
      - 'astro-app/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:

# Never let two preview deploys race; cancel an in-flight run when a newer push lands.
concurrency:
  group: deploy-capstone-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy ywcc-capstone-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The capstone_preview build is mostly SSR (content routes), but rss.xml and
      # the .ics endpoint still prerender and call loadQuery; under VE=true that hits
      # the drafts perspective, which requires the read token. Seed it via .dev.vars
      # (highest pick() precedence below process.env), mirroring ci.yml's seed step.
      - name: Seed read token for the build
        run: printf 'SANITY_API_READ_TOKEN=%s\n' '${{ secrets.SANITY_API_READ_TOKEN }}' > astro-app/.dev.vars

      # Runs predeploy:assert-fresh → CLOUDFLARE_ENV=capstone_preview astro build →
      # postbuild agent-discovery + no-localhost guard → wrangler deploy. The adapter
      # bakes env at build and writes dist/server/wrangler.json (worker name +
      # PUBLIC_SANITY_VISUAL_EDITING_ENABLED=true), which wrangler deploy reads.
      - name: Deploy
        run: npm run deploy:capstone-preview --workspace=astro-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '70bc6caa244ede05b7f964c0c2d533bb' }}
